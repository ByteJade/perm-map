<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Альянс Парк</title>
    <style>
        /* Убираем центрирование из body — контент течёт сверху вниз */
        body {
            margin: 0;
            font-family: sans-serif;
            /* НЕ ставим height: 100vh и НЕ ставим overflow: hidden */
        }

        /* 1. Изображение сверху — во всю ширину */
        .top-image {
            display: block;
            margin: 0 auto;         /* центрируем блок по горизонтали */
            width: 1000px;
            max-width: 55%;
            height: auto;
        }

        /* 2. Текст по центру */
        .content {
            max-width: 60%;       /* ограничиваем ширину текста */
            margin: 0 auto;         /* центрируем блок по горизонтали */
            padding: 40px 20px;     /* отступы сверху/снизу и по бокам */
            text-align: center;     /* сам текст по центру */
            font-size: 18px;
            line-height: 1.6;
        }

        /* 3. Группа изображений внизу */
        .gallery {
            display: flex;
            flex-wrap: wrap;        /* перенос на новую строку, если не влезают */
            justify-content: center;/* по центру по горизонтали */
            gap: 16px;              /* расстояние между картинками */
            padding: 40px 20px;
        }

        .gallery img {
            width: 400px;           /* размер каждой картинки */
            height: auto;
            display: block;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <!-- 1. Верхнее изображение -->
    <img src="position.png" alt="Позиция" class="top-image">

    <!-- 2. Текст по центру -->
    <div class="content">
        <p> Альянс Парк <br> «Альянс Парк» — это парк тактических игр, где можно поиграть в пейнтбол, лазертаг или гидробол. <br> Гости отмечают, что в парке много разных зон, что очень удобно. Также в парке есть уютные беседки с мангалами, где можно отдохнуть после игры.</p>
    </div>

    <!-- 3. Группа изображений внизу -->
    <div class="gallery">
        <img src="img1.jpg" alt="">
        <img src="img2.jpg" alt="">
        <img src="img3.jpg" alt="">
    </div>
    <div class="lightbox" id="lightbox">
        <img src="" alt="">
    </div>
</body>
</html>
